<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Fitapp</title>
    <meta name="color-scheme" content="light dark" />
    <script>
      /* Set the theme before the first paint so a dark phone does not flash white. */
      (function () {
        try {
          var c = localStorage.getItem('fitapp.theme');
          var dark = c === 'dark' || (c !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
    <meta name="theme-color" content="#065F46" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Fitapp" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      /* Self-heal: if the app has not started after 6 s (stale offline cache), drop the cache and reload once. Data in IndexedDB is not touched. */
      setTimeout(function () {
        try {
          var root = document.getElementById('root');
          if (root && root.childElementCount > 0) return;
          if (sessionStorage.getItem('fitapp.healed')) return;
          sessionStorage.setItem('fitapp.healed', '1');
          var done = function () { location.reload(); };
          var kill = function () { return window.caches ? caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }) : Promise.resolve(); };
          (navigator.serviceWorker ? navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }) : Promise.resolve()).then(kill).then(done, done);
        } catch (e) {}
      }, 6000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
